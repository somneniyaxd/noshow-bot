<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemindMe — бот, который перестаёт терять клиентов</title>
<meta name="description" content="Telegram-бот напомнит клиентам о записи. Меньше неявок — больше дохода.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #FBF6EF;
    color: #2B2620;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* HEADER */
  header {
    padding: 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
    color: #2B2620;
    letter-spacing: -0.5px;
  }
  .logo span { color: #E07B39; }

  .lang-switch { display: flex; gap: 8px; font-size: 14px; }
  .lang-switch button {
    color: #7A6F63;
    background: transparent;
    border: none;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .lang-switch button.active { background: #E07B39; color: white; }
  .lang-switch button:hover:not(.active) { background: #F0E8DC; }

  /* HERO */
  .hero { text-align: center; padding: 60px 0 40px; }
  .hero h1 {
    font-size: 52px; font-weight: 800;
    letter-spacing: -1.5px; line-height: 1.1;
    margin-bottom: 20px; color: #2B2620;
  }
  .hero h1 span { color: #E07B39; }
  .hero p {
    font-size: 20px; color: #5C5247;
    max-width: 620px; margin: 0 auto 36px;
  }

  .btn {
    display: inline-block;
    background: #E07B39; color: white;
    padding: 18px 40px; border-radius: 12px;
    font-size: 17px; font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(224, 123, 57, 0.25);
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(224, 123, 57, 0.35);
  }
  .btn-lg { padding: 22px 52px; font-size: 18px; }
  .btn-sub {
    display: block; margin-top: 14px;
    font-size: 14px; color: #7A6F63;
  }

  /* SCREENSHOTS MOCKUP */
  .screens {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 60px;
  }

  .phone {
    background: #1a1a1a;
    border-radius: 28px;
    padding: 16px 8px 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .phone-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 16px;
    color: white;
    border-bottom: 1px solid #2a2a2a;
    margin-bottom: 12px;
  }
  .phone-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #E07B39;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; font-size: 14px;
  }
  .phone-name { font-size: 14px; font-weight: 600; }
  .phone-status { font-size: 11px; color: #8a8a8a; }

  .phone-body { padding: 0 8px; }

  .msg {
    background: #2a2a2a;
    color: white;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.45;
    margin-bottom: 8px;
    max-width: 92%;
  }
  .msg.out {
    background: #2b5278;
    margin-left: auto;
  }

  .msg-btn {
    background: #2a2a2a;
    color: #6fa8dc;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    margin-bottom: 4px;
    border: 1px solid #333;
  }
  .msg-btn.green { color: #6dd06d; }
  .msg-btn.red { color: #e07070; }

  /* SECTIONS */
  .section { padding: 80px 0; }
  .section h2 {
    font-size: 36px; font-weight: 800;
    text-align: center; margin-bottom: 16px;
    letter-spacing: -0.8px;
  }
  .section .subtitle {
    text-align: center; color: #7A6F63;
    margin-bottom: 48px; font-size: 17px;
  }

  .problem-box {
    background: white; border-radius: 20px;
    padding: 40px; max-width: 760px;
    margin: 0 auto;
    border: 1px solid #F0E8DC;
  }
  .problem-box p {
    font-size: 18px; margin-bottom: 14px;
    color: #4A4139;
  }
  .problem-box p:last-child { margin-bottom: 0; }
  .problem-box strong { color: #E07B39; }

  .steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
    margin-top: 40px;
  }
  .step {
    background: white; padding: 32px 28px;
    border-radius: 18px; border: 1px solid #F0E8DC;
  }
  .step-num {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #FBEADB; color: #E07B39;
    font-weight: 700; font-size: 18px;
    margin-bottom: 18px;
  }
  .step h3 { font-size: 19px; margin-bottom: 10px; }
  .step p { color: #5C5247; font-size: 15px; }

  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 40px;
  }
  .feature {
    background: white; padding: 28px;
    border-radius: 16px; border: 1px solid #F0E8DC;
  }
  .feature-icon { font-size: 30px; margin-bottom: 14px; }
  .feature h3 { font-size: 17px; margin-bottom: 8px; }
  .feature p { font-size: 15px; color: #5C5247; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 24px;
    margin-top: 40px;
  }
  .stat {
    text-align: center;
    background: white; padding: 32px 20px;
    border-radius: 16px; border: 1px solid #F0E8DC;
  }
  .stat-num {
    font-size: 44px; font-weight: 800;
    color: #E07B39; letter-spacing: -1.5px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 15px; color: #5C5247;
  }

  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 40px;
  }
  .compare-col {
    background: white; padding: 32px 28px;
    border-radius: 18px; border: 1px solid #F0E8DC;
  }
  .compare-col.bad { border-color: #FFD8D8; background: #FFF8F8; }
  .compare-col.good { border-color: #D8F0D8; background: #F8FFF8; }
  .compare-col h3 {
    font-size: 20px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .compare-col ul { list-style: none; }
  .compare-col li {
    padding: 8px 0; font-size: 15px; color: #4A4139;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .compare-col li::before {
    content: "—"; color: #C0B0A0; flex-shrink: 0;
  }
  .compare-col.good li::before {
    content: "✓"; color: #4CAF50; font-weight: 700;
  }

  .pricing {
    background: white; border-radius: 24px;
    padding: 48px; max-width: 480px;
    margin: 40px auto 0;
    border: 1px solid #F0E8DC; text-align: center;
  }
  .pricing .price {
    font-size: 56px; font-weight: 800;
    color: #E07B39; letter-spacing: -2px;
  }
  .pricing .price span {
    font-size: 22px; color: #7A6F63; font-weight: 500;
  }
  .pricing .price-sub {
    color: #7A6F63; margin: 6px 0 28px; font-size: 15px;
  }
  .pricing ul {
    list-style: none; text-align: left;
    margin: 0 auto 32px; max-width: 320px;
  }
  .pricing li {
    padding: 10px 0; font-size: 15px;
    display: flex; align-items: center; gap: 10px;
  }
  .pricing li::before {
    content: "✓"; color: #E07B39;
    font-weight: 700; font-size: 18px; flex-shrink: 0;
  }

  .faq { max-width: 760px; margin: 40px auto 0; }
  .faq-item {
    background: white; border-radius: 14px;
    padding: 24px 28px; margin-bottom: 12px;
    border: 1px solid #F0E8DC;
  }
  .faq-item h3 { font-size: 17px; margin-bottom: 10px; }
  .faq-item p { color: #5C5247; font-size: 15px; }

  .final-cta { text-align: center; padding: 80px 0; }
  .final-cta h2 {
    font-size: 40px; font-weight: 800;
    margin-bottom: 16px; letter-spacing: -1px;
  }
  .final-cta p {
    color: #7A6F63; font-size: 18px;
    margin-bottom: 32px;
  }

  footer {
    padding: 40px 0; text-align: center;
    color: #9A8E80; font-size: 14px;
    border-top: 1px solid #F0E8DC;
  }

  @media (max-width: 780px) {
    .hero h1 { font-size: 36px; }
    .hero p { font-size: 17px; }
    .section h2 { font-size: 28px; }
    .screens { grid-template-columns: 1fr; }
    .compare { grid-template-columns: 1fr; }
    .pricing { padding: 32px 24px; }
    .final-cta h2 { font-size: 28px; }
  }
</style>
</head>

<script>
  function setLang(lang) {
    // Меняем текст у всех элементов с data-ru / data-en
    document.querySelectorAll('[data-ru][data-en]').forEach(function(el) {
      el.innerHTML = el.getAttribute('data-' + lang);
    });

    // Кнопки языка
    document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');

    // Меняем title и lang страницы
    document.documentElement.lang = lang;
    document.title = lang === 'ru'
      ? 'RemindMe — бот, который перестаёт терять клиентов'
      : 'RemindMe — stop losing clients to no-shows';

    // Сохраняем выбор
    localStorage.setItem('lang', lang);
  }

  // При загрузке — проверяем сохранённый язык
  (function() {
    var saved = localStorage.getItem('lang');
    if (saved === 'en') {
      setLang('en');
    }
  })();
</script>
